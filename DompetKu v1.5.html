<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DompetKu</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">

<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
}
.app{
  width:95%;
  max-width:420px;
  background:#0f172a;
  border-radius:20px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}
h1{text-align:center;margin-bottom:4px}
.subtitle{text-align:center;font-size:14px;opacity:.8;margin-bottom:16px}

.summary{
  display:grid;
  gap:12px;
  margin-bottom:20px;
}

/* CARD UMUM */
.card{
  background:#020617;
  border-radius:14px;
  padding:14px;
  border:1px solid #334155;
}

/* CASH */
.cash{
  border-left:6px solid #22c55e;
}
.cash p{
  color:#22c55e;
  font-size:20px;
  font-weight:bold;
}

/* DIGITAL */
.digital{
  border-left:6px solid #38bdf8;
}
.digital p{
  color:#38bdf8;
  font-size:20px;
  font-weight:bold;
}

/* TOTAL (DIPISAH & DITONJOLKAN) */
.total{
  margin-top:6px;
  background:linear-gradient(135deg,#f59e0b,#facc15);
  color:#1f2933;
  box-shadow:0 0 20px rgba(250,204,21,.35);
}
.total h3{
  color:#1f2933;
}
.total p{
  font-size:26px;
  font-weight:800;
}

/* INPUT */
.rp-input{
  display:flex;
  align-items:center;
  background:#020617;
  border:1px solid #334155;
  border-radius:10px;
  padding:8px;
  margin-bottom:8px;
}
.rp-input span{opacity:.7;margin-right:6px}
.rp-input input{
  background:transparent;
  border:none;
  outline:none;
  color:#fff;
  width:100%;
}

/* BUTTON */
button{
  border:none;
  border-radius:12px;
  padding:10px;
  font-weight:600;
  cursor:pointer;
}
.action{width:100%;background:#22c55e;color:#052e16}
.mini-btn{width:100%;margin:10px 0;background:#334155;color:#fff}

.btn-group{display:flex;gap:8px;margin-bottom:8px}
.btn-toggle{flex:1;background:#334155;color:#fff}
.btn-toggle.active{background:#22c55e;color:#052e16}
.btn-toggle.digital.active{background:#38bdf8;color:#020617}

.riwayat{font-size:13px;opacity:.9}
.footer{text-align:center;margin-top:12px;font-size:12px;opacity:.6}
.khusus {
  border-left:6px solid #22c55e
}
.btn-toggle.keluar.active{
  background:#ef4444;   /* merah */
  color:#fff;
}
</style>
</head>

<body>
<div class="app">
<h1>DompetKu</h1>
<div class="subtitle">Penghitung uang anti ribet</div>

<div class="summary">
  <div class="card cash">
    <h3>💵 Uang Tunai</h3>
    <p id="cash">Rp0</p>
  </div>

  <div class="card digital">
    <h3>📱 Dompet Digital</h3>
    <p id="digital">Rp0</p>
  </div>

  <div class="card total">
    <h3>💰 Total Uang</h3>
    <p id="total">Rp0</p>
  </div>
</div>

<div class="card" id="saldoAwal">
  <h2>➕ Saldo Awal</h2>
  <div class="rp-input"><span>Rp</span><input inputmode="numeric" id="inputCash"></div>
  <div class="rp-input"><span>Rp</span><input inputmode="numeric" id="inputDigital"></div>
  <button class="action" onclick="setSaldo()">Simpan Saldo</button>
</div>

<button class="mini-btn" onclick="toggleSaldoAwal()">⚙️ Ubah Saldo Awal</button>

<div class="card">
  <h2>🔄 Transaksi</h2>

  <div class="btn-group">
    <button class="btn-toggle active" onclick="setJenis('masuk',this)">⬆ Masuk</button>
    <button class="btn-toggle keluar" onclick="setJenis('keluar',this)">⬇ Keluar</button>
  </div>

  <div class="btn-group">
    <button class="btn-toggle active khusus" onclick="setSumber('cash',this)">💵 Tunai</button>
    <button class="btn-toggle digital" onclick="setSumber('digital',this)">📱 Digital</button>
  </div>

  <div class="rp-input"><span>Rp</span><input inputmode="numeric" id="jumlah"></div>
  <button class="action" onclick="tambahTransaksi()">Tambah</button>
</div>

<div class="card">
  <h2>🧾 Riwayat</h2>
  <div class="riwayat" id="riwayat"></div>
</div>

<button 
  class="action" 
  style="background:#ef4444;margin-top:10px"
  onclick="resetData()"
>
  🔄 Reset Semua Data
</button>

<div class="footer">DompetKu v1.4</div>
</div>

<script>
let cash=0,digital=0
let jenis='masuk',sumber='cash'

const f=n=>'Rp'+n.toLocaleString('id-ID')
const p=v=>Number(v.replace(/\./g,''))||0

function setJenis(j,b){
  jenis=j
  b.parentElement.querySelectorAll('.btn-toggle').forEach(x=>x.classList.remove('active'))
  b.classList.add('active')
}
function setSumber(s,b){
  sumber=s
  b.parentElement.querySelectorAll('.btn-toggle').forEach(x=>x.classList.remove('active'))
  b.classList.add('active')
}

function update(){
  cashEl.textContent=f(cash)
  digitalEl.textContent=f(digital)
  total.textContent=f(cash+digital)
}

function setSaldo(){
  cash=p(inputCash.value)
  digital=p(inputDigital.value)
  saldoAwal.style.display='none'
  update()
}

function toggleSaldoAwal(){
  saldoAwal.style.display=saldoAwal.style.display==='none'?'block':'none'
}

function tambahTransaksi(){
  const j=p(jumlah.value)
  if(!j)return
  if(jenis==='masuk') sumber==='cash'?cash+=j:digital+=j
  else sumber==='cash'?cash-=j:digital-=j
  jumlah.value=''
  update()
}

const cashEl=document.getElementById('cash')
const digitalEl=document.getElementById('digital')
const total=document.getElementById('total')

function formatInput(el){
  let angka = el.value.replace(/\D/g, ''); // hapus selain angka
  el.value = angka ? Number(angka).toLocaleString('id-ID') : '';
}

document.getElementById('inputCash').addEventListener('input', function(){
  formatInput(this);
});

document.getElementById('inputDigital').addEventListener('input', function(){
  formatInput(this);
});

document.getElementById('jumlah').addEventListener('input', function(){
  formatInput(this);
});

function resetData(){
  const yakin = confirm(
    '⚠️ Yakin ingin mereset semua data?\nSaldo akan kembali ke Rp0 dan tidak bisa dibatalkan.'
  );

  if(!yakin) return;

  // reset nilai
  cash = 0;
  digital = 0;

  // kosongkan input
  inputCash.value = '';
  inputDigital.value = '';
  jumlah.value = '';

  // tampilkan kembali saldo awal (opsional)
  saldoAwal.style.display = 'block';

  // update tampilan
  update();

  alert('✅ Data berhasil direset');
}

</script>
</body>
</html>
